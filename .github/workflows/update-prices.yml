name: 更新收盤價
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC = 台北 06:30（週二至週六早上），美股收盤後
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/update_prices.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "更新收盤價 $(date -u +%F)" && git push)
