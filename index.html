<header>📈 我的看盤頁</header>
<div class="wrap">
 <div class="side">

  </div>

 </div>
 <div id="sp" title="拖曳調整寬度"></div>
 <div class="card" id="cc"><h3>線圖 — 點代號切換</h3><div class="btns" id="btns"></div><div id="chart"></div></div>
<div class="card" id="hc"><h3>持股（只存在這台裝置）</h3><div id="holdings"></div>
   <form class="f" id="hf"><input id="ht" placeholder="代號 如 NASDAQ:GOOGL" required><input id="hq" type="number" step="any" placeholder="股數" required><input id="ha" type="number" step="any" placeholder="均價(美元)" required><input id="hx" type="number" step="any" placeholder="買進匯率 31.55"><button>新增/更新</button></form>
      <div class="note" id="st">持股只存在這台裝置的 localStorage，不會上傳。即時報價讀不到時改用最近一個美股交易日正盤收盤價（prices.json，每天台北 06:30 自動更新）。</div></div>
</div>
<script>
// ===== 內建預設群組 =====
const DEFAULT_GROUPS = [
 {name:"第一群組", symbols:["NASDAQ:SPCX","NASDAQ:TSLA","NASDAQ:NVDA","NASDAQ:GOOG","NASDAQ:QQQ","NASDAQ:PLTR","NASDAQ:INTC","NASDAQ:AMZN","NYSE:CRM","NYSE:ORCL","NASDAQ:META","NASDAQ:MSFT","NASDAQ:MU","NASDAQ:ANT"]},
 {name:"第二群組", symbols:["NYSE:RDW","NASDAQ:LUNR","NASDAQ:MNTS","NYSE:PL","NASDAQ:RKLB","NYSE:FIG","NYSE:P","NYSE:BBAI"]},
];
// v9 之前的內建代號（沒有 seen 清單的舊設定，用這份當「已看過」，避免把使用者刪過的舊代號加回來，同時讓 ANT 等新代號能合併進去）
const SEEN_BOOTSTRAP = ["NASDAQ:SPCX","NASDAQ:TSLA","NASDAQ:NVDA","NASDAQ:GOOG","NASDAQ:QQQ","NASDAQ:PLTR","NASDAQ:INTC","NASDAQ:AMZN","NYSE:CRM","NYSE:ORCL","NASDAQ:META","NASDAQ:MSFT","NASDAQ:MU","NYSE:RDW","NASDAQ:LUNR","NASDAQ:MNTS","NYSE:PL","NASDAQ:RKLB","NYSE:FIG","NYSE:P","NYSE:BBAI"];
// ====================
const $=id=>document.getElementById(id), short=s=>s.split(':').pop();
function embed(el,name,cfg){
 el.innerHTML='<div class="tradingview-widget-container" style="height:100%;width:100%"><div class="tradingview-widget-container__widget" style="height:100%"></div></div>';
 const s=document.createElement('script');s.src='https://s3.tradingview.com/external-embedding/embed-widget-'+name+'.js';s.async=true;
 s.textContent=JSON.stringify(cfg);el.firstChild.appendChild(s);}
const MOB=matchMedia('(max-width:959.98px)');let CUR=0,QM=null,CHART_SYM=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let PX={},PXO={};const VERSION='v9';let LQ={},LQT=null,LQM='';
const COLS=[['代號',52],['價格',68],['漲跌',62],['漲跌%',68],['名稱',150],['開盤',64],['最高',64],['最低',64],['昨收',64],['成交量',72]];
let FX=null,FXT=null;
const GS_KEY='watchlist.groups',EXS=['NASDAQ','NYSE','AMEX'];
const SYM_RE=/^[A-Z][A-Z0-9._]*:[A-Z0-9][A-Z0-9.]*$/, TICK_RE=/^[A-Z0-9][A-Z0-9.]*$/;
let GROUPS=[],SEEN=[];
const cloneG=g=>g.map(x=>({name:x.name,symbols:x.symbols.slice()}));
const allDef=()=>DEFAULT_GROUPS.flatMap(g=>g.symbols);
function normalizeGroups(arr){
 if(!Array.isArray(arr))return null;const out=[];
 for(const g of arr){
  if(!g||typeof g.name!=='string'||!g.name.trim()||!Array.isArray(g.symbols))return null;
  const symbols=[];
  for(const s of g.symbols){
   if(typeof s!=='string')return null;
   const u=s.trim().toUpperCase();
   if(!SYM_RE.test(u))return null;
   if(!symbols.includes(u))symbols.push(u);
  }
  out.push({name:g.name.trim(),symbols});
 }
 return out;
}
function mergeGroups(raw){
 if(raw==null)return{groups:cloneG(DEFAULT_GROUPS),seen:allDef()};
 let groups=null,seen=null;
 if(Array.isArray(raw))groups=normalizeGroups(raw);
 else if(raw&&typeof raw==='object'){
  groups=normalizeGroups(raw.groups);
  if(Array.isArray(raw.seen))seen=raw.seen.map(s=>String(s).toUpperCase());
 }
 if(!groups||!groups.length)return{groups:cloneG(DEFAULT_GROUPS),seen:allDef()};
 if(!seen)seen=SEEN_BOOTSTRAP.slice();
 const seenSet=new Set(seen);
 for(const dg of DEFAULT_GROUPS){
  for(const sym of dg.symbols){
   if(seenSet.has(sym))continue;
   const ug=groups.find(g=>g.name===dg.name);
   if(ug){if(!ug.symbols.includes(sym))ug.symbols.push(sym);seenSet.add(sym)}
  }
 }
 return{groups,seen:[...seenSet]};
}
function persist(){localStorage.setItem(GS_KEY,JSON.stringify({groups:GROUPS,seen:SEEN}))}
function loadGroups(){
 let raw=null;try{raw=JSON.parse(localStorage.getItem(GS_KEY)||'null')}catch(e){raw=null}
 const existed=raw!=null,r=mergeGroups(raw);
 GROUPS=r.groups;SEEN=r.seen;if(existed)persist();
}
// ===== 美股時段（America/New_York，自動處理夏令） =====
const QS=new URLSearchParams(location.search),NOW=()=>QS.get('now')?new Date(QS.get('now')):new Date();
// NYSE 休市日（2026–2027，半日市未計）
const HOL=new Set(['2026-01-01','2026-01-19','2026-02-16','2026-04-03','2026-05-25','2026-06-19','2026-07-03','2026-09-07','2026-11-26','2026-12-25','2027-01-01','2027-01-18','2027-02-15','2027-03-26','2027-05-31','2027-06-18','2027-07-05','2027-09-06','2027-11-25','2027-12-24']);
const NYF=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short'});
function ny(d){const p={};NYF.formatToParts(d).forEach(x=>p[x.type]=x.value);const h=+p.hour%24;
 const off=Math.round((Date.UTC(+p.year,p.month-1,+p.day,h,+p.minute,+p.second)-Math.floor(d/1000)*1000)/60000);
 const ymd=`${p.year}-${p.month}-${p.day}`;return{ymd,wd:p.weekday,min:h*60+ +p.minute,off,dst:off===-240,trading:!['Sat','Sun'].includes(p.weekday)&&!HOL.has(ymd)}}
const SESS=[['盤前',240,570],['正盤',570,960],['盤後',960,1200]];
function session(d){const n=ny(d);if(!n.trading)return HOL.has(n.ymd)?'休市（假日）':'休市（週末）';const s=SESS.find(s=>n.min>=s[1]&&n.min<s[2]);return s?s[0]:'休市'}
// 報價所屬的正盤交易日：正盤開始前的時間算前一個交易日
function tday(d){let t=new Date(+d),n=ny(t);if(n.trading&&n.min>=570)return n.ymd;
 for(let i=0;i<10;i++){t=new Date(t-864e5);n=ny(t);if(n.trading)return n.ymd}return n.ymd}
const md=ymd=>{const[,m,d]=ymd.split('-');return(+m)+'/'+(+d)},twt=d=>d.toLocaleTimeString('zh-TW',{hour12:false,timeZone:'Asia/Taipei'});
function qdates(){const ds={};GROUPS.flatMap(g=>g.symbols).forEach(x=>{const q=LQ[x],o=PXO[short(x)];const d=q&&q.c!=null&&q.t?tday(new Date(q.t*1000)):o&&o.date;if(d)(ds[d]=ds[d]||[]).push(short(x))});return ds}
function qlabel(){const ds=qdates(),ks=Object.keys(ds).sort(),last=ks[ks.length-1],ss=session(NOW());
 let t;if(ss==='正盤'&&LQT&&!LQM)t='延遲約 15 分鐘報價';else t=last?md(last)+' 正盤收盤價（不含盤前盤後）':'收盤價';
 let w='';if(ks.length>1)w=`<div class="warn">⚠ 各檔報價日期不一致：${ks.map(k=>md(k)+'：'+ds[k].join(', ')).join('；')}</div>`;return{t,w}}
function hours(){const d=NOW(),n=ny(d),ss=session(d),df=8*60-n.off;
 const f=m=>{const t=m+df,h=Math.floor(t/60);return(h>=24?'隔日 ':'')+String(h%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0')},e=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
 $('mhb').textContent='現在：'+ss;$('mhb').classList.toggle('live',ss==='正盤');
 let h=`<div class="note" style="margin-top:4px">美東目前為<b>${n.dst?'夏令時間（EDT，UTC−4）':'冬令時間（EST，UTC−5）'}</b>，台灣比美東快 ${df/60} 小時。現在美東 ${n.ymd.slice(5).replace('-','/')} ${e(n.min)}（${n.wd}），盤別：<b>${ss}</b>。</div>`;
 h+='<table class="ss"><tr><th>盤別</th><th>美東時間</th><th>台灣時間</th></tr>';
 SESS.forEach(s=>{h+=`<tr class="${ss===s[0]?'now':''}"><td>${s[0]}${ss===s[0]?' ◀':''}</td><td>${e(s[1])}–${e(s[2])}</td><td>${f(s[1]).startsWith('隔日')?f(s[1])+'–'+f(s[2]).slice(3):f(s[1])+'–'+f(s[2])}</td></tr>`});
 h+='</table><div class="note">台灣時間以美東當天日期為準，「隔日」指台灣的下一天。休市日已計入 2026–2027 年 NYSE 國定假日，半日市（提早收盤）未計。</div>';$('mhc').innerHTML=h}
async function live(){const t=[...new Set([...GROUPS.flatMap(g=>g.symbols),...load().map(o=>full(o.s))])];
 fetch('https://scanner.tradingview.com/forex/scan',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({symbols:{tickers:['FX_IDC:USDTWD']},columns:['close']})}).then(r=>r.json()).then(j=>{const v=j.data[0].d[0];if(v){FX=v;FXT=new Date()}render()}).catch(e=>console.warn(e));
 try{const r=await fetch('https://scanner.tradingview.com/america/scan',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({symbols:{tickers:t},columns:['close','change_abs','change','description','open','high','low','volume','update_mode','update_time']})});
  const j=await r.json();LQ={};j.data.forEach(o=>{const[c,a,d,n,op,hi,lo,v,m,t]=o.d;LQ[o.s]={c,a,d,n,op,hi,lo,v,m,t}});LQT=new Date();LQM='';}
 catch(e){LQM='即時報價讀取失敗，改用收盤價';console.warn(e)}
 mtable(CUR);render();hours();}
const fp=v=>v==null?'—':v.toFixed(v<10?3:2),fv=v=>v==null?'—':v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':String(v);
function mtable(i){const g=GROUPS[i];
 if(!g){$('quotes').innerHTML='<div class="note">尚無群組。</div>';return}
 if(!g.symbols.length){const L=qlabel();$('quotes').innerHTML='<div class="note">此群組尚無標的，請按「編輯」新增。</div><div class="mqd">'+(LQM?LQM+'・':'')+L.t+(LQT?'・資料抓取 '+twt(LQT)+'（台灣，每 60 秒）':LQM?'':'・載入中…')+L.w+'</div>';return}
 const tw=COLS.reduce((a,c)=>a+c[1],0);
 let h=`<div class="mqs"><table class="mq" style="width:${tw}px"><colgroup>${COLS.map(c=>`<col style="width:${c[1]}px">`).join('')}</colgroup><tr>${COLS.map(c=>`<th>${c[0]}</th>`).join('')}</tr>`;
 g.symbols.forEach(x=>{const q=LQ[x],o=PXO[short(x)];let r;
  if(q&&q.c!=null){const pv=q.a!=null?q.c-q.a:null;r=[q.c,q.a,q.d,q.n,q.op,q.hi,q.lo,pv,q.v]}
  else if(o&&o.close!=null){const a=o.prev?o.close-o.prev:null;r=[o.close,a,o.prev?(o.close/o.prev-1)*100:null,'',null,null,null,o.prev,null]}
  else r=[null,null,null,'',null,null,null,null,null];
  const c=r[1]==null?'':r[1]>=0?'up':'dn',sg=v=>v==null?'—':(v>=0?'+':'')+v.toFixed(2);
  h+=`<tr data-s="${esc(x)}"><td>${esc(short(x))}</td><td>${fp(r[0])}</td><td class="${c}">${sg(r[1])}</td><td class="${c}">${r[2]==null?'—':sg(r[2])+'%'}</td><td class="nm" title="${esc(r[3]||'')}">${esc(r[3]||'')}</td><td>${fp(r[4])}</td><td>${fp(r[5])}</td><td>${fp(r[6])}</td><td>${fp(r[7])}</td><td>${fv(r[8])}</td></tr>`});
 const L=qlabel();h+='</table></div><div class="mqd">'+(LQM?LQM+'・':'')+L.t+(LQT?'・資料抓取 '+twt(LQT)+'（台灣，每 60 秒）':LQM?'':'・載入中…')+'・點列切換線圖・左右滑看更多欄'+L.w+'</div>';
 $('quotes').innerHTML=h;$('quotes').querySelectorAll('tr[data-s]').forEach(r=>r.onclick=()=>chart(r.dataset.s));}
function quotes(i){CUR=i;[...$('tabs').children].forEach((b,j)=>b.classList.toggle('on',i===j));
 mtable(i);}
function chart(sym,init){CHART_SYM=sym;document.querySelectorAll('#btns button').forEach(b=>b.classList.toggle('on',b.dataset.s===sym));
 embed($('chart'),'advanced-chart',{autosize:true,symbol:sym,interval:"D",timezone:"Asia/Taipei",theme:"dark",style:"1",locale:"zh_TW",allow_symbol_change:true,withdateranges:true,calendar:false,
  studies:[{id:"MASimple@tv-basicstudies",inputs:{length:30}},{id:"MASimple@tv-basicstudies",inputs:{length:90}},{id:"MASimple@tv-basicstudies",inputs:{length:200}}]});
 if(!init&&innerWidth<960)$('chart').scrollIntoView({behavior:'smooth',block:'start'});}
function renderGroups(){
 $('tabs').innerHTML='';$('btns').innerHTML='';
 GROUPS.forEach((g,i)=>{
  const t=document.createElement('button');t.type='button';t.textContent=g.name;t.onclick=()=>quotes(i);$('tabs').appendChild(t);
  const l=document.createElement('div');l.className='lbl';l.textContent=g.name;$('btns').appendChild(l);
  g.symbols.forEach(x=>{const b=document.createElement('button');b.type='button';b.textContent=short(x);b.dataset.s=x;b.onclick=()=>chart(x);$('btns').appendChild(b)});
 });
 if(CUR>=GROUPS.length)CUR=Math.max(0,GROUPS.length-1);
 quotes(CUR);

function gmsg(t,ok){const el=$('gmsg');el.textContent=t||'';el.className='note'+(t?ok?' ok':' err':'')}
function renderGPanel(){
 $('glist').innerHTML=GROUPS.map((g,i)=>{
  const chips=g.symbols.map((x,si)=>`<span class="gchip" title="${esc(x)}">${esc(short(x))}<button type="button" class="x" data-act="rm" data-i="${i}" data-si="${si}" aria-label="移除 ${esc(short(x))}">✕</button></span>`).join('')||'<span class="note">尚無標的</span>';
  return `<div class="gitem"><div class="f"><input class="gnm" data-i="${i}" value="${esc(g.name)}"><button type="button" data-act="ren" data-i="${i}">改名</button><button type="button" data-act="del" data-i="${i}">刪除</button></div><div class="gchips">${chips}</div><div class="f"><input class="gsym" data-i="${i}" placeholder="代號，如 ANT 或 NYSE:CRM"><button type="button" data-act="add" data-i="${i}">新增代號</button></div></div>`;
 }).join('');
 $('glist').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>gact(b.dataset.act,+b.dataset.i,b.dataset.si==null?null:+b.dataset.si));

}
async function gact(act,i,si){
 if(act==='rm'){const s=GROUPS[i].symbols.splice(si,1)[0];persist();renderGroups();renderGPanel();live();gmsg('已從「'+GROUPS[i].name+'」移除 '+short(s),true);return}
 if(act==='del'){
  if(GROUPS.length<=1){gmsg('至少要保留一個群組',false);return}
  if(!confirm('確定刪除群組「'+GROUPS[i].name+'」？'))return;
  const n=GROUPS[i].name;GROUPS.splice(i,1);if(CUR>=GROUPS.length)CUR=GROUPS.length-1;persist();renderGroups();renderGPanel();live();gmsg('已刪除群組「'+n+'」',true);return}
 if(act==='ren'){renameGroup(i,$('glist').querySelector(`.gnm[data-i="${i}"]`).value);return}
 if(act==='add'){const inp=$('glist').querySelector(`.gsym[data-i="${i}"]`);await addSymbol(i,inp?inp.value:'');}
}
function renameGroup(i,name){
 name=String(name||'').trim();
 if(!name){gmsg('群組名稱不能空白',false);renderGPanel();return}
 if(GROUPS.some((g,j)=>j!==i&&g.name===name)){gmsg('已有相同名稱的群組',false);renderGPanel();return}
 if(GROUPS[i].name===name)return;
 GROUPS[i].name=name;persist();renderGroups();renderGPanel();gmsg('已改名為「'+name+'」',true);
}
async function resolveSymbol(s){
 s=String(s||'').trim().toUpperCase().replace(/\s+/g,'');
 if(!s)return{error:'請輸入代號'};
 const scan=async tickers=>{
  const r=await fetch('https://scanner.tradingview.com/america/scan',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({symbols:{tickers},columns:['close']})});
  return r.json();
 };
 try{
  if(s.includes(':')){
   if(!SYM_RE.test(s))return{error:'代號格式不正確'};
   const j=await scan([s]);
   const hit=(j.data||[]).find(o=>o.d&&o.d[0]!=null);
   if(!hit)return{error:'找不到這個代號，請確認後再試'};
   return{symbol:s};
  }
  if(!TICK_RE.test(s))return{error:'代號格式不正確'};
  const tickers=EXS.map(ex=>ex+':'+s),j=await scan(tickers);
  const found=new Set((j.data||[]).filter(o=>o.d&&o.d[0]!=null).map(o=>o.s));
  for(const t of tickers){if(found.has(t))return{symbol:t}}
  return{error:'找不到這個代號，請確認後再試，或輸入完整代號如 NYSE:CRM'};
 }catch(e){console.warn(e);return{error:'查詢失敗，請稍後再試'}}
}
async function addSymbol(i,raw){
 const r=await resolveSymbol(raw);
 if(r.error){gmsg(r.error,false);return}
 if(GROUPS[i].symbols.includes(r.symbol)){gmsg('此群組已有 '+r.symbol,false);return}
 GROUPS[i].symbols.push(r.symbol);persist();renderGroups();renderGPanel();live();
 const inp=$('glist').querySelector(`.gsym[data-i="${i}"]`);if(inp)inp.value='';
 gmsg('已新增 '+r.symbol,true);
}
function addGroup(){
 const name=($('gnew').value||'').trim();
 if(!name){gmsg('請輸入群組名稱',false);return}
 if(GROUPS.some(g=>g.name===name)){gmsg('已有相同名稱的群組',false);return}
 GROUPS.push({name,symbols:[]});$('gnew').value='';CUR=GROUPS.length-1;persist();renderGroups();renderGPanel();gmsg('已新增群組「'+name+'」',true);
}
function resetGroups(){
 if(!confirm('確定要還原成預設群組？自訂的群組與標的都會被清除。'))return;
 GROUPS=cloneG(DEFAULT_GROUPS);SEEN=allDef();persist();renderGroups();renderGPanel();live();gmsg('已還原預設群組',true);
}
async function exportGroups(){
 const t=JSON.stringify({groups:GROUPS,seen:SEEN},null,2);
 $('gjson').value=t;$('gjson').focus();$('gjson').select();
 try{await navigator.clipboard.writeText(t);gmsg('已匯出並複製到剪貼簿，可貼到另一台裝置匯入。',true)}
 catch(e){gmsg('已匯出，請複製下方 JSON。',true)}
}
function importGroups(){
 const t=($('gjson').value||'').trim();
 if(!t){gmsg('請先貼上要匯入的 JSON',false);return}
 let raw;try{raw=JSON.parse(t)}catch(e){gmsg('JSON 格式不正確',false);return}
 let groups=null,seen=null;
 if(Array.isArray(raw)){groups=normalizeGroups(raw);if(groups)seen=[...new Set([...SEEN,...groups.flatMap(g=>g.symbols)])]}
 else if(raw&&typeof raw==='object'){groups=normalizeGroups(raw.groups);seen=Array.isArray(raw.seen)?raw.seen.map(s=>String(s).toUpperCase()):(groups?[...new Set([...SEEN,...groups.flatMap(g=>g.symbols)])]:null)}
 if(!groups||!groups.length){gmsg('匯入的資料沒有有效群組',false);return}
 if(!confirm('匯入會覆蓋目前的群組設定，確定嗎？'))return;
 GROUPS=groups;SEEN=seen&&seen.length?seen:SEEN;persist();renderGroups();renderGPanel();live();gmsg('已匯入群組設定',true);
}
function bindEditor(){
 $('gedit').onclick=()=>{const p=$('gpanel'),open=p.hidden;p.hidden=!open;$('gedit').textContent=open?'完成':'編輯';$('gedit').classList.toggle('on',open);if(open){renderGPanel();gmsg('')}};
